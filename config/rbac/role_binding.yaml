# 把身份验证和执行操作进行绑定
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rollout-operator-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rollout-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: rollout-operator-controller-manager
    namespace: rollout-system