# 将认证与租约权限进行绑定
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rollout-operator-leader-election-rolebinding
  namespace: rollout-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rollout-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: rollout-operator-controller-manager
    namespace: rollout-system